[package]
name = "starsector-devtool"
version = "0.1.0"
description = "Native Starsector mod configuration tool"
authors = ["Starsector DevTool"]
edition = "2021"

[lib]
name = "starsector_devtool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
csv = "1.3"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
walkdir = "2.5"

